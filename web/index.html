<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>局域网文件共享</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%81%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #e4e7ed;
    --text: #303133;
    --text-2: #606266;
    --text-3: #909399;
    --primary: #409eff;
    --primary-hover: #66b1ff;
    --success: #67c23a;
    --danger: #f56c6c;
    --danger-hover: #f78989;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 24px 20px; }

  /* 头部 */
  .header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .title { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .title .icon { font-size: 24px; }

  /* Tabs */
  .tabs { display: flex; gap: 6px; }
  .tab {
    padding: 7px 18px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-2);
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }
  .tab:hover { color: var(--primary); border-color: var(--primary); }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }

  /* 上传目标目录提示 */
  .upload-target {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    font-size: 13px; color: var(--text-3);
    margin: -4px 0 12px;
  }
  .upload-target .ut-path {
    color: var(--primary); cursor: pointer;
    background: rgba(64,158,255,0.08);
    padding: 3px 10px; border-radius: 12px;
    max-width: 420px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .upload-target .ut-path:hover { background: rgba(64,158,255,0.16); }

  /* 按钮 */
  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .2s;
    font-family: inherit;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { opacity: .9; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: var(--danger-hover); }
  .btn-ghost { background: transparent; color: var(--text-2); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--primary); border-color: var(--primary); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  /* 面包屑 */
  .breadcrumb {
    padding: 12px 0 0;
    font-size: 14px;
    color: var(--text-3);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
  }
  .breadcrumb a { color: var(--primary); text-decoration: none; cursor: pointer; }
  .breadcrumb a:hover { text-decoration: underline; }
  .breadcrumb .sep { color: var(--text-3); margin: 0 2px; }

  /* 拖拽区 */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    color: var(--text-3);
    margin-bottom: 16px;
    transition: all .2s;
    display: none;
  }
  .drop-zone.active {
    border-color: var(--primary);
    background: rgba(64,158,255,0.05);
    color: var(--primary);
  }

  /* 文件列表 */
  .file-list {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .file-item {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    transition: background .15s;
    gap: 12px;
  }
  .file-item:last-child { border-bottom: none; }
  .file-item:hover { background: #f5f7fa; }
  .file-icon { font-size: 20px; width: 24px; text-align: center; }
  .file-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-name a { color: var(--text); text-decoration: none; cursor: pointer; }
  .file-name a:hover { color: var(--primary); }
  .file-name .dir-link { color: var(--text); cursor: pointer; }
  .file-name .dir-link:hover { color: var(--primary); }
  .file-size { width: 80px; text-align: right; color: var(--text-3); font-size: 13px; }
  .file-time { width: 130px; text-align: right; color: var(--text-3); font-size: 13px; }
  .file-ops { width: 70px; text-align: right; display: flex; gap: 4px; justify-content: flex-end; }
  .file-check { width: 20px; flex-shrink: 0; display: flex; align-items: center; }
  .file-check input { width: 16px; height: 16px; cursor: pointer; margin: 0; }
  .file-header { background: #fafafa; font-size: 13px; color: var(--text-3); font-weight: 500; }
  .file-header:hover { background: #fafafa; }

  /* 批量操作栏 */
  .batch-bar {
    display: none;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px 20px;
    margin-bottom: 16px;
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }
  .batch-bar.show { display: flex; }
  .batch-bar .count { color: var(--text-2); }

  .empty {
    padding: 48px 20px;
    text-align: center;
    color: var(--text-3);
  }
  .empty .big-icon { font-size: 48px; margin-bottom: 12px; }

  /* 上传进度 */
  .upload-bar {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px 20px;
    margin-bottom: 16px;
    display: none;
  }
  .upload-bar .row { display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .progress { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress .fill { height: 100%; background: var(--primary); transition: width .3s; }

  /* 提示 */
  .toast-stack {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: max-content;
    max-width: calc(100vw - 32px);
    pointer-events: none;
  }
  .toast {
    background: var(--text);
    color: #fff;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    box-shadow: var(--shadow);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .25s, transform .25s;
    max-width: 100%;
    word-break: break-word;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--danger); }
  .toast.success { background: var(--success); }

  input[type=file] { display: none; }

  /* 共享剪切板 */
  .clip-compose {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 16px;
  }
  .clip-compose textarea {
    width: 100%;
    min-height: 90px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
    color: var(--text);
    box-sizing: border-box;
    line-height: 1.6;
  }
  .clip-compose textarea:focus { outline: none; border-color: var(--primary); }
  .clip-compose .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .clip-hint { font-size: 12px; color: var(--text-3); }
  .clip-section-title { font-size: 14px; color: var(--text-2); font-weight: 600; }
  .clip-list { display: flex; flex-direction: column; gap: 12px; }
  .clip-item {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
  }
  .clip-item .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; color: var(--text-3); gap: 8px; }
  .clip-item .ops { display: flex; gap: 6px; flex-shrink: 0; }
  .clip-text {
    white-space: pre-wrap;
    word-break: break-all;
    font-size: 14px;
    line-height: 1.6;
    max-height: 220px;
    overflow: auto;
    background: #f8f9fb;
    border-radius: 6px;
    padding: 10px;
  }
  .clip-text a { color: var(--primary); word-break: break-all; }
  .clip-img-box { background: #1f1f1f; border-radius: 6px; padding: 8px; text-align: center; }
  .clip-img { max-width: 100%; max-height: 320px; border-radius: 4px; cursor: zoom-in; display: inline-block; }

  /* 搜索框 */
  .clip-search {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    width: 190px;
    outline: none;
    font-family: inherit;
    color: var(--text);
    background: var(--card);
    transition: border-color .2s;
  }
  .clip-search:focus { border-color: var(--primary); }
  .clip-search::placeholder { color: var(--text-3); }
  .clip-search::-webkit-search-cancel-button { cursor: pointer; }
  mark {
    background: rgba(64,158,255,0.22);
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }

  /* 行内编辑 */
  .clip-edit-ta {
    width: 100%;
    min-height: 90px;
    border: 1px solid var(--primary);
    border-radius: 6px;
    padding: 10px;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
    color: var(--text);
    box-sizing: border-box;
    line-height: 1.6;
    background: #fdfefe;
    outline: none;
  }
  .clip-edited { color: var(--primary); font-weight: 500; }

  /* 行操作菜单 */
  .row-menu {
    position: fixed;
    z-index: 10000;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,.14);
    padding: 6px;
    display: flex;
    flex-direction: column;
    min-width: 156px;
  }
  .row-menu[hidden] { display: none; }
  .row-menu button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 9px 12px;
    border: none;
    background: none;
    border-radius: 6px;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    text-align: left;
  }
  .row-menu button:hover { background: #f5f7fa; }
  .row-menu button.danger { color: var(--danger); }
  .row-menu button[hidden] { display: none; }

  /* 可恢复的错误态 */
  .empty.error-state { color: var(--text-2); }
  .empty.error-state .btn { margin-top: 14px; }

  /* 骨架屏 */
  .skeleton-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  .skeleton-row:last-child { border-bottom: none; }
  .skeleton-bar {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, #eef1f5 25%, #f7f9fc 50%, #eef1f5 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* 上传结果 / 失败清单 */
  .upload-result {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 20px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .upload-result[hidden] { display: none; }
  .upload-result .ur-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .upload-result .ur-title { font-weight: 600; color: var(--text); }
  .upload-result ul { margin: 6px 0 0 18px; color: var(--text-2); max-height: 160px; overflow: auto; word-break: break-all; }
  .upload-result li { line-height: 1.7; }
  .upload-result .ur-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .btn:focus-visible, .tab:focus-visible, .row-menu button:focus-visible,
  input:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
  .btn:disabled { opacity: .55; cursor: not-allowed; }

  @media (max-width: 600px) {
    .container { padding: 12px; }
    .header { padding: 14px 16px; }
    .header-top { align-items: flex-start; }
    .title { font-size: 18px; }
    .tabs { width: 100%; }
    .tab { flex: 1; padding: 9px 10px; }
    .toolbar .btn { flex: 1 1 auto; justify-content: center; }
    .upload-target .ut-path { max-width: 100%; }

    /* 文件行改为两行，避免文件名被操作按钮挤成几个字 */
    .file-header { display: none; }
    .file-item { flex-wrap: wrap; padding: 12px 14px; gap: 4px 10px; }
    .file-check { order: 1; }
    .file-icon { order: 2; font-size: 18px; }
    .file-name { order: 3; flex: 1 1 auto; min-width: 0; font-size: 15px; }
    .file-ops { order: 4; width: auto; }
    .file-size { order: 5; width: 100%; text-align: left; padding-left: 54px; font-size: 12px; }
    .file-time { display: none; }
    /* 目录没有大小，移动端不必占一整行 */
    .file-item[data-isdir="1"] .file-size { display: none; }

    /* 触摸目标不小于 40px */
    .btn-sm { min-height: 40px; min-width: 40px; justify-content: center; }
    .file-ops .btn-sm { min-width: 40px; }

    .clip-compose .row { gap: 8px; }
    .clip-compose .row .btn { flex: 1 1 auto; justify-content: center; }
    .clip-search { width: 100%; flex: 1 1 100%; }
    .clip-toolbar-right { width: 100%; }
    .clip-item .meta { flex-wrap: wrap; }
    .batch-bar { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="container">
  <!-- 头部 -->
  <div class="header">
    <div class="header-top">
      <div class="title"><span class="icon">📁</span> 局域网文件共享</div>
      <div class="tabs">
        <button class="tab active" data-view="file" onclick="switchView('file')">📁 文件</button>
        <button class="tab" data-view="clip" onclick="switchView('clip')">📋 共享剪切板</button>
      </div>
    </div>
  </div>

  <!-- 拖拽提示（两个视图共用） -->
  <div class="drop-zone" id="dropZone">松开鼠标即可上传文件</div>

  <!-- 文件视图 -->
  <div id="fileView">
    <div class="toolbar">
      <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">📤 上传文件</button>
      <button class="btn btn-ghost" onclick="document.getElementById('dirInput').click()">📁 上传文件夹</button>
      <button class="btn btn-ghost" onclick="mkdir()">🗂 新建文件夹</button>
    </div>

    <div class="upload-target">
      <span>上传到</span>
      <span class="ut-path" id="uploadPathText" onclick="editUploadTarget()" title="点击修改目标目录">/</span>
      <span class="clip-hint">点路径可改；也可直接拖文件夹进来</span>
    </div>

    <div class="breadcrumb" id="breadcrumb"></div>

    <!-- 上传进度 -->
    <div class="upload-bar" id="uploadBar">
      <div class="row">
        <span id="uploadText">上传中...</span>
        <div class="progress"><div class="fill" id="progressFill" style="width:0%"></div></div>
        <button class="btn btn-ghost btn-sm" id="uploadCancel" onclick="cancelUpload()">取消</button>
      </div>
    </div>

    <!-- 上传结果（失败清单可展开） -->
    <div class="upload-result" id="uploadResult" hidden></div>

    <!-- 批量操作栏 -->
    <div class="batch-bar" id="batchBar">
      <span class="count" id="batchCount">已选 0 项</span>
      <div style="flex:1"></div>
      <button class="btn btn-success btn-sm" onclick="batchDownload()">📦 批量下载</button>
      <button class="btn btn-danger btn-sm" onclick="batchDelete()">🗑 批量删除</button>
      <button class="btn btn-ghost btn-sm" onclick="clearSelection()">取消</button>
    </div>

    <!-- 文件列表 -->
    <div class="file-list" id="fileList">
      <div class="empty"><div class="big-icon">📂</div>加载中...</div>
    </div>
    <input type="file" id="fileInput" multiple>
    <input type="file" id="dirInput" webkitdirectory directory multiple>
  </div>

  <!-- 共享剪切板视图 -->
  <div id="clipView" style="display:none">
    <div class="clip-compose">
      <textarea id="clipInput" placeholder="把要共享的文字粘贴/输入到这里，点「发布」即可让局域网其他设备看到..."></textarea>
      <div class="row">
        <button class="btn btn-primary" onclick="publishClip()">📤 发布文字</button>
        <button class="btn btn-ghost" onclick="document.getElementById('clipFileInput').click()">🖼 选择图片发布</button>
        <span class="clip-hint">提示：在剪切板区域直接 Ctrl+V 可粘贴截图发布；点击图片可放大</span>
      </div>
      <input type="file" id="clipFileInput" accept="image/*">
    </div>

    <div class="toolbar" style="justify-content:space-between">
      <span class="clip-section-title">📋 共享内容</span>
      <div class="clip-toolbar-right" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input type="search" id="clipSearch" class="clip-search" placeholder="🔍 搜索共享内容（仅文字）" aria-label="搜索共享内容">
        <button class="btn btn-ghost btn-sm" onclick="loadClipboard()">🔄 刷新</button>
        <button class="btn btn-danger btn-sm" onclick="clearClip()">🧹 清空全部</button>
      </div>
    </div>

    <div class="clip-hint" id="clipSyncStatus" role="status"></div>
    <div class="clip-hint" id="clipSearchSummary"></div>
    <div class="clip-list" id="clipList">
      <div class="empty"><div class="big-icon">📋</div>还没有共享内容，发布一条试试～</div>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

<!-- 行操作菜单 -->
<div class="row-menu" id="rowMenu" hidden></div>

<script>
let currentPath = '';
let currentView = 'file';
let selectedItems = new Set();
let clipTexts = {};        // 文字条目 id -> 文本（供复制按钮读取，避免 HTML 注入）
let allClipItems = [];     // 全部剪贴板条目缓存（搜索过滤用）
let editingClipId = null;  // 正在行内编辑的条目 id

// ---- 工具函数 ----
// 多条提示按顺序排队展示，避免上传结束时的「成功/超限/失败」互相覆盖
const toastQueue = [];
let toastRunning = false;

function toast(msg, type) {
  toastQueue.push({ msg, type: type || '' });
  if (!toastRunning) runToastQueue();
}

async function runToastQueue() {
  toastRunning = true;
  const stack = document.getElementById('toastStack');
  while (toastQueue.length) {
    const { msg, type } = toastQueue.shift();
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.setAttribute('role', type === 'error' ? 'alert' : 'status');
    el.textContent = msg;
    stack.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    await new Promise(r => setTimeout(r, 2600));
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }
  toastRunning = false;
}

async function api(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// 文件名只写进 data-* 属性，不再拼进 onclick；这里仍做完整属性转义以防万一
function escapeAttr(s) { return escapeHtml(String(s)); }
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function linkifyEscaped(esc) {
  return esc.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function linkify(text) { return linkifyEscaped(escapeHtml(text)); }

// 渲染剪贴板文本：带搜索词时按大小写不敏感匹配分段并高亮
const HIGHLIGHT_MAX = 50;   // 单条内容最多高亮 50 处，避免长文本整段拼 DOM 卡顿
function renderText(text, q) {
  if (!q) return linkify(text);
  const esc = escapeHtml(text);
  const qEsc = escapeRegex(escapeHtml(q));
  const parts = esc.split(new RegExp('(' + qEsc + ')', 'gi'));
  // 带捕获组的 split：奇数下标必是匹配段
  let marks = 0;
  return parts.map((p, i) => {
    if (i % 2 === 1 && marks < HIGHLIGHT_MAX) { marks++; return '<mark>' + p + '</mark>'; }
    return linkifyEscaped(p);
  }).join('');
}

// ================= 视图切换 =================
function switchView(v) {
  currentView = v;
  document.getElementById('fileView').style.display = v === 'file' ? 'block' : 'none';
  document.getElementById('clipView').style.display = v === 'clip' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));

// ================= 文件视图 =================
async function loadList(path) {
  currentPath = path || '';
  uploadTarget = currentPath;   // 切换目录时，上传目标默认跟随当前目录
  updateUploadTargetText();
  renderSkeleton();
  try {
    const data = await api('/api/list?path=' + encodeURIComponent(currentPath));
    renderBreadcrumb(data.path);
    renderList(data.items);
  } catch (e) {
    renderBreadcrumb(currentPath);
    renderListError(e.message);
  }
}

// 加载中的骨架行，避免整块区域停留在纯文字「加载中...」造成白屏观感
function renderSkeleton() {
  const el = document.getElementById('fileList');
  let html = '<div class="file-item file-header">'
    + '<div class="file-check"></div><div class="file-icon"></div>'
    + '<div class="file-name">名称</div><div class="file-size">大小</div>'
    + '<div class="file-time">修改时间</div><div class="file-ops">操作</div></div>';
  const widths = ['52%', '38%', '64%', '45%', '58%'];
  for (let i = 0; i < 5; i++) {
    html += `<div class="skeleton-row">
      <div class="skeleton-bar" style="width:16px;height:16px;flex:none"></div>
      <div class="skeleton-bar" style="width:20px;flex:none"></div>
      <div class="skeleton-bar" style="width:${widths[i]}"></div>
      <div class="skeleton-bar" style="width:52px;flex:none;margin-left:auto"></div>
    </div>`;
  }
  el.innerHTML = html;
}

// 失败时给出可点击的重试入口，而不是把页面留在「加载中」
function renderListError(message) {
  const el = document.getElementById('fileList');
  el.innerHTML = `<div class="empty error-state">
    <div class="big-icon">⚠️</div>
    <div>目录加载失败</div>
    <div style="margin-top:6px;font-size:13px">${escapeHtml(message || '网络异常')}</div>
    <button class="btn btn-ghost btn-sm" onclick="loadList(currentPath)">🔄 重试</button>
    ${currentPath ? '<button class="btn btn-ghost btn-sm" onclick="loadList(\'\')" style="margin-left:8px">返回根目录</button>' : ''}
  </div>`;
}

function renderBreadcrumb(path) {
  const el = document.getElementById('breadcrumb');
  const crumb = (label, target) =>
    `<a href="#" class="crumb" data-path="${escapeAttr(target)}">${escapeHtml(label)}</a>`;
  let html = crumb('全部文件', '');
  if (path) {
    const parts = path.split('/').filter(Boolean);
    let acc = '';
    parts.forEach(p => {
      acc = acc ? acc + '/' + p : p;
      html += `<span class="sep">/</span>` + crumb(p, acc);
    });
  }
  el.innerHTML = html;
}

function renderList(items) {
  const el = document.getElementById('fileList');
  clearSelection();
  if (!items.length) {
    el.innerHTML = '<div class="empty"><div class="big-icon">📂</div>空文件夹，点上方按钮上传文件吧～</div>';
    return;
  }
  items.sort((a, b) => (a.is_dir === b.is_dir) ? a.name.localeCompare(b.name, 'zh') : (a.is_dir ? -1 : 1));

  let html = `
    <div class="file-item file-header">
      <div class="file-check"><input type="checkbox" id="selectAll" aria-label="全选"></div>

  items.forEach(item => {

    // 目录用 <a href="#"> 以获得键盘可达性；文件名与路径只走 data-*，不拼进事件属性
    const nameHtml = item.is_dir
      ? `<a href="#" class="dir-link" data-dir="${escapeAttr(item.name)}">${escapeHtml(item.name)}</a>`

        <div class="file-icon">${icon}</div>
        <div class="file-name">${nameHtml}</div>
        <div class="file-size">${escapeHtml(item.size_text)}</div>
        <div class="file-time">${escapeHtml(item.modified)}</div>
        <div class="file-ops">
          <button class="btn btn-ghost btn-sm" data-action="menu" aria-haspopup="menu" aria-label="更多操作：${escapeAttr(item.name)}" title="更多操作">⋯</button>
        </div>

function fileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  const map = { mp3:'🎵', wav:'🎵', mp4:'🎬', avi:'🎬', mov:'🎬', mkv:'🎬',
    jpg:'🖼', jpeg:'🖼', png:'🖼', gif:'🖼', bmp:'🖼', svg:'🖼',
    pdf:'📄', doc:'📄', docx:'📄', xls:'📊', xlsx:'📊', ppt:'📊', pptx:'📊',
    zip:'📦', rar:'📦', '7z':'📦', gz:'📦', tar:'📦',
    txt:'📝', md:'📝', py:'🐍', js:'📜', html:'🌐', css:'🎨', json:'⚙️', exe:'⚙️' };

}

function enterDir(name) {

// ---- 多选与批量操作 ----
function toggleSelect(checkbox) {
  if (checkbox.checked) selectedItems.add(checkbox.value);
  else selectedItems.delete(checkbox.value);
  updateBatchBar();
}

function toggleAll(checked) {
  document.querySelectorAll('.file-item:not(.file-header) .file-check input[type=checkbox]').forEach(cb => {
    cb.checked = checked;
    if (checked) selectedItems.add(cb.value);
    else selectedItems.delete(cb.value);
  });
  updateBatchBar();
}

function clearSelection() {
  selectedItems.clear();
  document.querySelectorAll('.file-item .file-check input[type=checkbox]').forEach(cb => { cb.checked = false; });
  updateBatchBar();
}

function updateBatchBar() {
  const bar = document.getElementById('batchBar');
  const count = document.getElementById('batchCount');
  if (selectedItems.size > 0) {
    bar.classList.add('show');
    count.textContent = `已选 ${selectedItems.size} 项`;

    bar.classList.remove('show');

// 批量删除前把实际条目列出来，避免只看到「3 项」就误删
function batchDeleteSummary() {
  const names = [...selectedItems].map(p => p.split('/').pop());
  const head = names.slice(0, 5).map(n => `「${n}」`).join('、');
  return names.length > 5 ? `${head} 等 ${names.length} 项` : head;
}

async function batchDownload() {
  if (selectedItems.size === 0) return;
  const paths = [...selectedItems];
  toast(`正在打包 ${paths.length} 项...`);
  try {
    const res = await fetch('/api/download-zip', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paths })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || '打包失败');
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'files.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast(`已下载 ${paths.length} 项`, 'success');
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function batchDelete() {
  if (selectedItems.size === 0) return;
  if (!confirm(`确定删除以下内容吗？此操作不可恢复！\n\n${batchDeleteSummary()}`)) return;
  const paths = [...selectedItems];
  const failed = [];
  for (const p of paths) {
    try {
      await api('/api/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: p })
      });
      selectedItems.delete(p);
    } catch (e) { failed.push(p); }
  }
  const ok = paths.length - failed.length;
  if (failed.length) {
    toast(`已删除 ${ok} 项，${failed.length} 项失败：${failed.slice(0, 3).map(p => p.split('/').pop()).join('、')}${failed.length > 3 ? ' 等' : ''}`, 'error');
  } else {
    toast(`已删除 ${ok} 项`, 'success');
  }
  loadList(currentPath);
}

// ---- 上传 ----
let uploadTarget = '';                       // 上传目标目录（相对共享根），默认跟随当前浏览目录
let uploading = false;                      // 同一页面只运行一组上传任务
let fileItemCache = [];                     // 最近一次上传的 {file, rel} 列表，供失败重试复用
const BATCH_MAX_FILES = 20;                  // 单批最多文件数
const BATCH_MAX_BYTES = 32 * 1024 * 1024;    // 单批最大字节数

document.getElementById('fileInput').addEventListener('change', function(e) {
  uploadItems(filesToItems(e.target.files));
  e.target.value = '';
});

document.getElementById('dirInput').addEventListener('change', function(e) {
  uploadItems(filesToItems(e.target.files));
  e.target.value = '';
});

// FileList -> [{file, rel}]，文件夹上传时用 webkitRelativePath 保留目录结构
function filesToItems(fileList) {
  const out = [];
  for (const f of fileList) {
    const rel = f.webkitRelativePath || f.relativePath || '';
    out.push({ file: f, rel: rel || f.name });
  }
  return out;
}

function updateUploadTargetText() {
  const el = document.getElementById('uploadPathText');
  if (el) el.textContent = uploadTarget ? '/' + uploadTarget : '/ （根目录）';
}

function editUploadTarget() {
  const v = prompt('上传到哪个目录？\n（相对于共享根目录，留空表示根目录）', uploadTarget || '');
  if (v === null) return;
  uploadTarget = String(v).replace(/\\/g, '/').replace(/^\/+|\/+$/g, '').trim();
  updateUploadTargetText();
  toast(uploadTarget ? `上传目标已改为 /${uploadTarget}` : '上传目标已改为根目录');
}

// 按文件数与总字节数分批，避免一次请求塞进整个大文件夹
function makeBatches(items) {
  const batches = [];
  let cur = [], bytes = 0;
  for (const it of items) {
    const sz = it.file.size || 0;
    if (cur.length && (cur.length >= BATCH_MAX_FILES || bytes + sz > BATCH_MAX_BYTES)) {
      batches.push(cur);
      cur = [];
      bytes = 0;
    }
    cur.push(it);
    bytes += sz;
  }
  if (cur.length) batches.push(cur);
  return batches;
}

function uploadBatch(batch, target, onProgress, registerXhr) {
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append('dir', target);
    for (const it of batch) fd.append('files', it.file, it.rel);
    const xhr = new XMLHttpRequest();
    if (registerXhr) registerXhr(xhr);
    xhr.upload.addEventListener('progress', e => {
      if (e.lengthComputable && onProgress) onProgress(e.loaded);
    });
    xhr.addEventListener('load', () => {
      let data = {};
      try { data = JSON.parse(xhr.responseText); } catch (err) { /* 非 JSON 响应 */ }
      if (xhr.status === 200) resolve(data);
      else {
        const error = new Error(data.error || `上传失败（HTTP ${xhr.status}）`);
        error.retryable = xhr.status === 408 || xhr.status === 503;
        reject(error);
      }
    });
    xhr.addEventListener('error', () => {
      const error = new Error('网络中断');
      error.retryable = true;
      reject(error);
    });
    xhr.addEventListener('abort', () => {
      const error = new Error('已取消');
      error.aborted = true;
      reject(error);
    });
    xhr.open('POST', '/api/upload');
    xhr.timeout = 0;                         // 不限制总时长，由服务端检测连续无数据超时
    xhr.send(fd);
  });
}

function setUploadProgress(pct, text) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('uploadText').textContent = text;
}

// 上传控制：取消信号 + 当前请求句柄
const uploadCtl = { cancelled: false, xhr: null };

function cancelUpload() {
  if (!uploading) return;
  uploadCtl.cancelled = true;
  if (uploadCtl.xhr) { try { uploadCtl.xhr.abort(); } catch (e) {} }
  setUploadProgress(0, '正在取消...');
}

// 上传结果面板：成功数 + 失败清单（可展开），失败项支持一键重试
let lastFailedItems = [];
let lastUploadTarget = '';

function showUploadResult(okCount, failed, oversize, target, cancelled) {
  const box = document.getElementById('uploadResult');
  lastFailedItems = failed;
  lastUploadTarget = target;
  if (!failed.length && !oversize.length && !cancelled) {
    box.hidden = true;
    box.innerHTML = '';
    return;
  }
  const parts = [];
  if (okCount) parts.push(`成功 ${okCount} 个`);
  if (cancelled) parts.push('已取消');
  if (oversize.length) parts.push(`${oversize.length} 个超出大小上限`);
  if (failed.length) parts.push(`${failed.length} 个失败`);

  let html = `<div class="ur-head">
      <span class="ur-title">${cancelled ? '🚫 上传已取消' : '⚠️ 上传未全部完成'}</span>
      <span style="color:var(--text-3)">${parts.join(' · ')}${target ? ` → /${escapeHtml(target)}` : ' → 根目录'}</span>
    </div>`;

  if (oversize.length) {
    html += `<div style="margin-top:6px;color:var(--text-2)">超过服务端大小上限的文件已跳过：</div>
      <ul>${oversize.slice(0, 20).map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul>`;
  }
  if (failed.length) {
    html += `<div style="margin-top:6px;color:var(--text-2)">失败的文件：</div>
      <ul>${failed.slice(0, 50).map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul>`;
    if (failed.length > 50) html += `<div style="color:var(--text-3)">…另有 ${failed.length - 50} 项未列出</div>`;
  }
  html += `<div class="ur-actions">
      ${failed.length ? '<button class="btn btn-primary btn-sm" onclick="retryFailedUpload()">🔄 重试失败项</button>' : ''}
      <button class="btn btn-ghost btn-sm" onclick="hideUploadResult()">关闭</button>
    </div>`;
  box.innerHTML = html;
  box.hidden = false;
}

function hideUploadResult() {
  const box = document.getElementById('uploadResult');
  box.hidden = true;
  box.innerHTML = '';
  lastFailedItems = [];
}

function retryFailedUpload() {
  if (!lastFailedItems.length) return;
  const names = new Set(lastFailedItems);
  // 失败项以相对路径记录，这里按路径末段与当前目录项匹配后重新排队
  const items = [...fileItemCache].filter(it => names.has(it.rel) || names.has(it.file.name));
  hideUploadResult();
  if (!items.length) { toast('原文件已不在选择中，请重新选择后上传', 'error'); return; }
  uploadTarget = lastUploadTarget;
  updateUploadTargetText();
  uploadItems(items);
}

async function uploadItems(items) {
  if (!items || !items.length) return;
  if (uploading) { toast('已有上传任务，请等待完成', 'error'); return; }
  uploading = true;
  uploadCtl.cancelled = false;
  uploadCtl.xhr = null;
  hideUploadResult();
  fileItemCache = items;
  const target = uploadTarget || '';
  const batches = makeBatches(items);
  const totalBytes = items.reduce((s, x) => s + (x.file.size || 0), 0);
  const bar = document.getElementById('uploadBar');
  bar.style.display = 'block';
  document.getElementById('uploadCancel').disabled = false;
  setUploadProgress(0, `准备上传 ${items.length} 个文件...`);

  let okCount = 0, doneFiles = 0, doneBytes = 0;
  const failed = [], oversize = [];
  let cancelled = false;

  for (let i = 0; i < batches.length; i++) {
    if (uploadCtl.cancelled) { cancelled = true; break; }
    const batch = batches[i];
    const range = `${doneFiles + 1}-${doneFiles + batch.length}`;
    const baseText = `上传中 ${range}/${items.length} 个文件（第 ${i + 1}/${batches.length} 批）`;
    setUploadProgress(totalBytes ? Math.round(doneBytes / totalBytes * 100) : 0, baseText);
    try {
      let data;
      for (let attempt = 0; ; attempt++) {
        if (uploadCtl.cancelled) { cancelled = true; break; }
        try {
          data = await uploadBatch(batch, target, loaded => {
            const pct = totalBytes ? Math.round((doneBytes + loaded) / totalBytes * 100) : 0;
            setUploadProgress(pct, `${baseText} · ${pct}%`);
          }, xhr => { uploadCtl.xhr = xhr; });
          break;
        } catch (error) {
          if (error.aborted) throw error;
          // 仅对单文件网络故障重试，避免多文件批次部分成功后重复发布。
          if (batch.length !== 1 || !error.retryable || attempt >= 2) throw error;
          const wait = (attempt + 1) * 5000;
          setUploadProgress(totalBytes ? Math.round(doneBytes / totalBytes * 100) : 0,
            `${baseText} · 连接中断，${wait / 1000} 秒后重新上传（重试 ${attempt + 1}/2）`);
          // 等待期间可被「取消」立即打断
          await new Promise(resolve => {
            const t = setTimeout(resolve, wait);
            const tick = setInterval(() => {
              if (uploadCtl.cancelled) { clearTimeout(t); clearInterval(tick); resolve(); }
            }, 200);
            setTimeout(() => clearInterval(tick), wait + 50);
          });
          if (uploadCtl.cancelled) { cancelled = true; break; }
        }
      }
      if (cancelled) break;
      okCount += data.count || 0;
      if (data.oversize) oversize.push(...data.oversize);
      if (data.skipped) failed.push(...data.skipped);
    } catch (e) {
      if (e.aborted) { cancelled = true; break; }
      failed.push(...batch.map(x => x.rel));
      if (batches.length === 1) toast(e.message, 'error');
    }
    doneFiles += batch.length;
    doneBytes += batch.reduce((s, x) => s + (x.file.size || 0), 0);
  }

  bar.style.display = 'none';
  uploading = false;
  uploadCtl.xhr = null;
  setUploadProgress(0, '上传中...');

  if (okCount) {
    toast(`已上传 ${okCount} 个文件到 ${target ? '/' + target : '根目录'}`, 'success');
    loadList(currentPath);
  }
  if (cancelled) toast('上传已取消', 'error');
  if (oversize.length) toast(`${oversize.length} 个文件超过大小上限，已跳过`, 'error');
  if (failed.length) toast(`${failed.length} 个文件上传失败`, 'error');
  if (!okCount && !oversize.length && !failed.length && !cancelled) toast('没有可上传的文件', 'error');
  showUploadResult(okCount, failed, oversize, target, cancelled);
}

// ---- 拖拽上传（支持拖文件夹）----
async function itemsFromDataTransfer(dt) {
  const items = dt.items;
  if (!items || !items.length || !items[0].webkitGetAsEntry) {
    return filesToItems(dt.files);   // 浏览器不支持目录遍历时降级为普通文件
  }
  // webkitGetAsEntry 必须同步调用，异步之后 items 会失效
  const entries = [];
  for (const it of items) {
    if (it.kind !== 'file') continue;
    const en = it.webkitGetAsEntry();
    if (en) entries.push(en);
  }
  const out = [];
  for (const en of entries) await walkEntry(en, '', out);
  return out;
}

function walkEntry(entry, prefix, out) {
  return new Promise(resolve => {
    if (entry.isFile) {
      entry.file(f => {
        out.push({ file: f, rel: prefix ? prefix + '/' + f.name : f.name });
        resolve();
      }, () => resolve());
    } else if (entry.isDirectory) {
      const dirPrefix = prefix ? prefix + '/' + entry.name : entry.name;
      const reader = entry.createReader();
      // readEntries 每次最多返回 100 项，必须反复读到空数组为止
      const readMore = () => {
        reader.readEntries(async batch => {
          if (!batch.length) { resolve(); return; }
          for (const e of batch) await walkEntry(e, dirPrefix, out);
          readMore();
        }, () => resolve());
      };
      readMore();
    } else {
      resolve();
    }
  });
}

let dragCounter = 0;
window.addEventListener('dragenter', e => {
  e.preventDefault();
  dragCounter++;
  const dz = document.getElementById('dropZone');
  dz.style.display = 'block';
  dz.textContent = currentView === 'clip'
    ? '松开鼠标即可上传图片到剪切板'
    : '松开鼠标即可上传文件或文件夹';
  setTimeout(() => dz.classList.add('active'), 0);
});
window.addEventListener('dragleave', e => {
  e.preventDefault();
  dragCounter--;
  if (dragCounter <= 0) {
    document.getElementById('dropZone').classList.remove('active');
    setTimeout(() => { if (dragCounter <= 0) document.getElementById('dropZone').style.display = 'none'; }, 100);
  }
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', async e => {
  e.preventDefault();
  dragCounter = 0;
  document.getElementById('dropZone').classList.remove('active');
  document.getElementById('dropZone').style.display = 'none';
  if (currentView === 'clip') {
    for (const f of e.dataTransfer.files) {
      if (f.type.startsWith('image/')) uploadClipImage(f);
    }
    return;
  }
  const items = await itemsFromDataTransfer(e.dataTransfer);
  if (items.length) uploadItems(items);
});

// ---- 行操作菜单 ----
// 用事件委托统一处理列表里的点击/键盘事件：文件名、目录、菜单按钮都只带 data-*，
// 不再把名称拼进内联 onclick，避免反斜杠/引号破坏脚本，也顺带获得键盘可达性。
const rowMenu = document.getElementById('rowMenu');
let menuOwnerPath = '';

function closeRowMenu() {
  rowMenu.hidden = true;
  rowMenu.innerHTML = '';
  menuOwnerPath = '';
}

function openRowMenu(btn, itemPath, itemName, isDir) {
  const rect = btn.getBoundingClientRect();
  menuOwnerPath = itemPath;
  const actions = [];
  if (!isDir) actions.push({ action: 'download', icon: '⬇️', label: '下载' });
  actions.push({ action: 'rename', icon: '✏️', label: '重命名' });
  actions.push({ action: 'delete', icon: '🗑', label: '删除', danger: true });
  rowMenu.innerHTML = actions.map(a =>
    `<button type="button" role="menuitem" data-action="${a.action}" class="${a.danger ? 'danger' : ''}">
      <span>${a.icon}</span><span>${escapeHtml(a.label)}</span>
    </button>`).join('');
  rowMenu.dataset.name = itemName;
  rowMenu.dataset.dir = isDir ? '1' : '0';
  rowMenu.hidden = false;
  // 贴边时向内收，避免菜单超出视口
  const w = rowMenu.offsetWidth, h = rowMenu.offsetHeight;
  let left = Math.min(rect.right - w, window.innerWidth - w - 8);
  let top = rect.bottom + 4;
  if (top + h > window.innerHeight - 8) top = Math.max(8, rect.top - h - 4);
  rowMenu.style.left = Math.max(8, left) + 'px';
  rowMenu.style.top = top + 'px';
  const first = rowMenu.querySelector('button');
  if (first) first.focus();
}

rowMenu.addEventListener('click', e => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const name = rowMenu.dataset.name;
  const isDir = rowMenu.dataset.dir === '1';
  const path = menuOwnerPath;
  closeRowMenu();
  if (btn.dataset.action === 'download') {
    window.location.href = '/api/download/' + encodeURIComponent(path);
  } else if (btn.dataset.action === 'rename') {
    renameItem(name);
  } else if (btn.dataset.action === 'delete') {
    deleteItem(name, isDir);
  }
});

document.addEventListener('click', e => {
  if (!rowMenu.hidden && !rowMenu.contains(e.target) && !e.target.closest('[data-action="menu"]')) closeRowMenu();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !rowMenu.hidden) { closeRowMenu(); }
});
window.addEventListener('resize', closeRowMenu);
window.addEventListener('scroll', closeRowMenu, true);

document.getElementById('fileList').addEventListener('click', e => {
  const menuBtn = e.target.closest('[data-action="menu"]');
  if (menuBtn) {
    e.preventDefault();
    const row = menuBtn.closest('.file-item');
    if (row) openRowMenu(menuBtn, row.dataset.path, row.dataset.name, row.dataset.isdir === '1');
    return;
  }
  // 目录链接单独用 data-dir 存目录名；行的 data-isdir 只表示是否为目录
  const dirLink = e.target.closest('.dir-link');
  if (dirLink && dirLink.dataset.dir !== undefined) {
    e.preventDefault();
    enterDir(dirLink.dataset.dir);
  }
});

// 面包屑在 #fileList 之外，单独绑定
document.getElementById('breadcrumb').addEventListener('click', e => {
  const crumb = e.target.closest('.crumb');
  if (!crumb) return;
  e.preventDefault();
  loadList(crumb.dataset.path);
});

document.getElementById('fileList').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'selectAll') { toggleAll(t.checked); return; }
  if (t.matches('.file-check input[type=checkbox]')) toggleSelect(t);
});

// 目录名可用 Enter/Space 进入（<a href="#"> 本身已可聚焦）
document.getElementById('fileList').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const dirLink = e.target.closest('.dir-link');
  if (dirLink) { e.preventDefault(); enterDir(dirLink.dataset.dir); }
});

// ---- 新建文件夹 ----
async function mkdir() {
  const name = prompt('请输入文件夹名称：');
  if (!name) return;
  try {
    await api('/api/mkdir', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: currentPath, name })
    });
    toast('文件夹已创建', 'success');
    loadList(currentPath);
  } catch (e) { toast(e.message, 'error'); }
}

// ---- 删除 ----
async function deleteItem(name, isDir) {
  const tip = isDir
    ? `确定删除文件夹「${name}」吗？\n\n若文件夹内还有内容，可能无法删除或会一并删除，此操作不可恢复！`
    : `确定删除「${name}」吗？此操作不可恢复！`;
  if (!confirm(tip)) return;
  const path = currentPath ? currentPath + '/' + name : name;
  try {
    await api('/api/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path })
    });
    toast('已删除', 'success');
    loadList(currentPath);
  } catch (e) { toast(e.message, 'error'); }
}

// ---- 重命名 ----
async function renameItem(name) {
  const newName = prompt(`重命名「${name}」为：`, name);
  if (!newName || newName === name) return;
  const path = currentPath ? currentPath + '/' + name : name;
  try {
    await api('/api/rename', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, name: newName })
    });
    toast('已重命名', 'success');
    loadList(currentPath);
  } catch (e) { toast(e.message, 'error'); }
}

// ================= 共享剪切板 =================
async function publishClip() {
  const ta = document.getElementById('clipInput');
  const text = ta.value;
  if (!text.trim()) { toast('内容不能为空', 'error'); return; }
  try {
    await api('/api/clipboard', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    ta.value = '';
    toast('已发布到共享剪切板', 'success');
    loadClipboard();
  } catch (e) { toast(e.message, 'error'); }
}

document.getElementById('clipFileInput').addEventListener('change', function(e) {
  if (e.target.files.length) uploadClipImage(e.target.files[0]);
  e.target.value = '';
});

function uploadClipImage(file) {
  if (!file || !file.type.startsWith('image/')) { toast('请选择图片', 'error'); return; }
  const fd = new FormData();
  fd.append('file', file, file.name || 'image.png');
  toast('正在发布图片...');
  fetch('/api/clipboard/image', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(d => {
      if (d.error) toast(d.error, 'error');
      else { toast('图片已发布', 'success'); loadClipboard(); }
    })
    .catch(() => toast('图片发布失败', 'error'));
}

// Ctrl+V 直接粘贴截图发布（仅剪切板视图）
document.addEventListener('paste', e => {
  if (currentView !== 'clip') return;
  const items = (e.clipboardData || window.clipboardData || {}).items;
  if (!items) return;
  for (const it of items) {
    if (it.kind === 'file' && it.type.startsWith('image/')) {
      e.preventDefault();
      const blob = it.getAsFile();
      if (blob) uploadClipImage(blob);
      return;
    }
  }
});

// 复制文字到剪贴板（兼容 http 非安全上下文）
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('已复制到剪贴板', 'success');
  } catch (e) {
    toast('复制失败，请手动选择文本复制', 'error');
  }
}

function copyClip(id) {
  const t = clipTexts[id];
  if (t !== undefined) copyText(t);
}

async function deleteClip(id) {
  if (!confirm('确定删除这条共享内容吗？')) return;
  try {
    await api('/api/clipboard/' + id, { method: 'DELETE' });
    if (editingClipId === id) editingClipId = null;
    toast('已删除', 'success');
    loadClipboard();
  } catch (e) { toast(e.message, 'error'); }
}

async function clearClip() {
  if (!confirm('确定清空全部共享内容吗？此操作不可恢复！')) return;
  try {
    await api('/api/clipboard/clear', { method: 'POST' });
    editingClipId = null;
    toast('已清空', 'success');
    loadClipboard();
  } catch (e) { toast(e.message, 'error'); }
}

let clipLoading = false;
async function loadClipboard(automatic = false) {
  if (clipLoading || (automatic && editingClipId)) return;
  clipLoading = true;
  try {
    const data = await api('/api/clipboard');
    document.getElementById('clipSyncStatus').textContent = data.sync
      ? (data.sync.peers
          ? `当前节点：${data.sync.node} · ${data.sync.peers.map(p => `${p.node === 'peer' ? '对端' : p.node} ${p.online ? '在线' : '离线或连接中'}`).join(' · ')} · 本机可独立读写`
          : (data.sync.peer_online ? '对端在线，剪切板同步中' : '对端暂时离线，本机仍可读写剪切板'))
      : '';
    // 请求期间开始编辑时，保留用户尚未保存的输入。
    if (editingClipId) return;
    const changed = JSON.stringify(data.items || []) !== JSON.stringify(allClipItems);
    allClipItems = data.items || [];
    if (!automatic || changed) renderClipboard();
  } catch (e) {
    if (!automatic) toast(e.message, 'error');
  } finally { clipLoading = false; }
}

// 只在剪切板页面可见时轮询，编辑过程中暂停。
setInterval(() => {
  if (currentView === 'clip' && !document.hidden) loadClipboard(true);
}, 2000);
document.addEventListener('visibilitychange', () => {
  if (currentView === 'clip' && !document.hidden) loadClipboard(true);
});

// ---- 搜索 ----
function clipSearchQuery() {
  const el = document.getElementById('clipSearch');
  return el ? el.value.trim() : '';
}

// 搜索输入做 200ms 防抖：避免每个按键都重渲染整个列表和高亮
let clipSearchTimer = null;
function filterClipboard() {
  clearTimeout(clipSearchTimer);
  clipSearchTimer = setTimeout(() => {
    renderClipboard();
    updateSearchSummary(clipSearchQuery());
  }, 200);
}

function updateSearchSummary(q) {
  const el = document.getElementById('clipSearchSummary');
  if (!el) return;
  if (!q) { el.textContent = ''; return; }
  const matched = allClipItems.filter(it => it.type === 'text' && (it.text || '').toLowerCase().includes(q.toLowerCase())).length;
  const images = allClipItems.filter(it => it.type === 'image').length;
  el.textContent = `匹配 ${matched} 条文字${images ? ` · ${images} 张图片不参与搜索` : ''}`;
}

// 输入、清空（search 事件）、以及边框复位都走同一套渲染
document.getElementById('clipSearch').addEventListener('input', filterClipboard);
document.getElementById('clipSearch').addEventListener('search', function() {
  clearTimeout(clipSearchTimer);
  renderClipboard();
  updateSearchSummary(this.value.trim());
});

function renderClipboard() {
  const q = clipSearchQuery();
  const el = document.getElementById('clipList');
  clipTexts = {};
  let items = allClipItems;
  if (q) items = items.filter(it => it.type === 'text' && (it.text || '').toLowerCase().includes(q.toLowerCase()));
  if (!items.length) {
    el.innerHTML = q
      ? `<div class="empty"><div class="big-icon">🔍</div>没有匹配「${escapeHtml(q)}」的共享内容</div>`
      : '<div class="empty"><div class="big-icon">📋</div>还没有共享内容，发布一条试试～</div>';
    return;
  }
  let html = '';
  items.forEach(it => {
    const syncTag = typeof it.replicas === 'number'
      ? ` · 已确认保存 ${it.replicas}/${it.replica_total} 台${it.pending_nodes.length ? '，等待 ' + escapeHtml(it.pending_nodes.map(n => n === 'peer' ? '对端' : n).join('、')) : ''}`
      : (typeof it.synced === 'boolean' ? (it.synced ? ' · 已同步到两台' : ' · 本机已保存，等待同步') : '');
    if (it.type === 'image') {
      html += `
        <div class="clip-item" data-clip-id="${it.id}">
          <div class="meta">
            <span>🖼 图片 · ${it.created_at}${syncTag}</span>
            <div class="ops">
              <a class="btn btn-ghost btn-sm" href="/api/clipboard/file/${it.id}" download target="_blank">⬇️ 保存</a>
              <button class="btn btn-danger btn-sm" onclick="deleteClip('${it.id}')">🗑</button>
            </div>
          </div>
          <div class="clip-img-box"><img class="clip-img" src="/api/clipboard/file/${it.id}" loading="lazy" decoding="async" alt="共享图片" onclick="window.open(this.src)" title="点击放大 · 右键可复制图片"></div>
          <div class="clip-hint" style="margin-top:6px">右键图片 → 复制图片；或点「保存」下载</div>
        </div>`;
    } else if (it.id === editingClipId) {
      // 行内编辑态：textarea 显示原文，保存/取消走下方按钮或快捷键
      clipTexts[it.id] = it.text;
      html += `
        <div class="clip-item" data-clip-id="${it.id}">
          <div class="meta">
            <span>📝 文字 · ${it.created_at} · <span class="clip-edited">正在编辑</span></span>
            <div class="ops">
              <button class="btn btn-success btn-sm" onclick="saveClipEdit('${it.id}')">✅ 保存</button>
              <button class="btn btn-ghost btn-sm" onclick="cancelClipEdit()">取消</button>
            </div>
          </div>
          <textarea id="clipEditTa" class="clip-edit-ta">${escapeHtml(it.text)}</textarea>
          <div class="clip-hint" style="margin-top:6px">Ctrl+Enter 保存 · Esc 取消</div>
        </div>`;
    } else {
      clipTexts[it.id] = it.text;
      const editedTag = it.updated_at ? ' · <span class="clip-edited">✏️ 已编辑</span>' : '';
      html += `
        <div class="clip-item" data-clip-id="${it.id}">
          <div class="meta">
            <span>📝 文字 · ${it.created_at}${editedTag}${syncTag}</span>
            <div class="ops">
              <button class="btn btn-ghost btn-sm" onclick="copyClip('${it.id}')">📋 复制</button>
              <button class="btn btn-ghost btn-sm" onclick="editClip('${it.id}')">✏️ 编辑</button>
              <button class="btn btn-danger btn-sm" onclick="deleteClip('${it.id}')">🗑</button>
            </div>
          </div>
          <div class="clip-text">${renderText(it.text, q)}</div>
        </div>`;
    }
  });
  el.innerHTML = html;
  const ta = document.getElementById('clipEditTa');
  if (ta) {
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    ta.style.height = Math.max(90, ta.scrollHeight + 4) + 'px';
  }
}

// ---- 行内编辑 ----
function editClip(id) {
  editingClipId = id;
  renderClipboard();
}

function cancelClipEdit() {
  editingClipId = null;
  renderClipboard();
}

async function saveClipEdit(id) {
  const ta = document.getElementById('clipEditTa');
  if (!ta || !id) return;
  const text = ta.value;
  if (!text.trim()) { toast('内容不能为空', 'error'); return; }
  try {
    await api('/api/clipboard/edit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, text })
    });
    editingClipId = null;
    toast('已保存修改', 'success');
    loadClipboard();
  } catch (e) { toast(e.message, 'error'); }
}

// 编辑框快捷键：Esc 取消，Ctrl/Cmd+Enter 保存
document.addEventListener('keydown', e => {
  if (!editingClipId || !e.target || e.target.id !== 'clipEditTa') return;
  if (e.key === 'Escape') { e.preventDefault(); cancelClipEdit(); }
  else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveClipEdit(editingClipId); }
});

// 初始化
loadList('');
</script>
